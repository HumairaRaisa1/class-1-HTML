<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<form action="https://example.com" method="post" enctype="multipart/form-data">

    <div>
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="Tahsin" required>
    </div>

    <br>

    <div>
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="Tasnim" required>
    </div>

    <br>

    <div>
        <label for="pass">Password:</label>
        <input type="password" id="pass" name="pass" maxlength="12" required>
    </div>

    <br>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="tahsintasnim@gmail.com">
    </div>

    <br>

    <div>
        <label for="bdate">Birthdate:</label>
        <input type="date" id="bdate" name="bdate">
    </div>

    <br>

    <div>
        <label for="department">Department:</label>
        <select id="department" name="department">
            <option value="swe">Software Engineering</option>
            <option value="cse">Computer Science</option>
            <option value="eee">Electrical Engineering</option>
            <option value="bba">Business Administration</option>
        </select>
    </div>

    <br>

    <div>
        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file">
    </div>

    <br>

    <div>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="0" max="99" value="1">
    </div>

    <br>

    <div>
        <input type="reset" value="Reset">
        <input type="submit" value="Submit">
    </div>

</form>

</body>
</html>
